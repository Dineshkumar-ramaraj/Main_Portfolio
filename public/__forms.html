<!-- This file exists only so Netlify's build bot can detect the contact form at deploy time. -->
<!-- The real form is rendered client-side in src/components/Contact/index.js -->
<html>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" />
      <input name="email" />
      <input name="mobile" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
